name: Build Campus Connect Student APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract Android project ZIP
      - name: Extract Android project ZIP
        run: |
          mkdir -p project
          unzip -q "CampusConnectStudent_FIXED (1).zip" -d project

          echo "=== Extracted project ==="
          find project -maxdepth 3 -type f | head -100

      # 3. Find Android project
      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -type f -name "gradlew" | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            echo "ZIP contents:"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      # 4. Set up Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 5. Make Gradle executable
      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      # 6. Check Gradle version
      - name: Check Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      # 7. Build Debug APK
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug \
            --no-daemon \
            --max-workers=1 \
            --stacktrace

      # 8. Find generated APK
      - name: Find APK
        run: |
          echo "=== APK files ==="
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 9. Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusConnectStudent-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
