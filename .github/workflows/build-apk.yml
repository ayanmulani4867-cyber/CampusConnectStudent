name: Build Campus Connect Student APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract the fixed Android project ZIP
      - name: Extract Android project ZIP
        run: |
          set -e

          mkdir -p project

          ZIP_FILE="./CampusConnectStudent_FULLY_FIXED2.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in repository root."
            echo "Files in repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo "=== Extracted project ==="
          find project -maxdepth 3 -type f | sort | head -200

      # 3. Find Gradle project automatically
      - name: Find Gradle project
        run: |
          set -e

          GRADLEW=$(find project -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            echo "ZIP contents:"
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      # 4. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 5. Make Gradle executable
      - name: Make Gradle executable
        run: |
          set -e
          chmod +x "$PROJECT_DIR/gradlew"

      # 6. Check Gradle
      - name: Check Gradle
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --version

      # 7. Build Debug APK
      - name: Build Debug APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx2g
            -Dfile.encoding=UTF-8
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --max-workers=1 \
            --stacktrace

      # 8. Find generated APK
      - name: Find APK
        run: |
          set -e

          echo "=== Generated APK files ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusConnectStudent-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
