name: Build Campus Connect Student APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          mkdir -p project
          unzip -q "CampusConnectStudent_FIXED2.zip" -d project

          echo "=== Extracted files ==="
          find project -maxdepth 3 -type f | head -100

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -type f -name "gradlew" | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Check Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug \
            --no-daemon \
            --max-workers=1 \
            --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusConnectStudent-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
